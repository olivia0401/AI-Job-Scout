name: CI

# Runs on every push to main and every pull request targeting main.
# Everything here is offline: unit tests plus the ranking-metric smoke test
# (eval/run_eval.py needs no API key and no network).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Only what the tests need: Flask/requests (imported at the top of app.py),
        # the parsing/export libraries, and pytest. openai / anthropic are optional
        # online features that the tests never call, so they are not installed.
        run: |
          python -m pip install --upgrade pip
          pip install flask requests openpyxl pypdf pytest

      - name: Run unit tests
        # `python -m` puts the repo root on sys.path so tests can `import app`.
        run: python -m pytest tests/ -q

      - name: Evaluation smoke test (ranking metrics on the seed set)
        run: python eval/run_eval.py
