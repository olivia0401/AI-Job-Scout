# 自建服务器 / 本机用 Docker 跑：docker compose up -d
# 说明：这个应用是单进程内存态 + 后台扫描线程，务必单实例（不要 scale / 多副本）。
services:
  app:
    build: .
    image: ai-job-scout
    container_name: ai-job-scout
    restart: unless-stopped
    ports:
      - "8080:8080"          # 浏览器访问 http://<服务器IP>:8080
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      # ⚠️ 部署到公网务必设置登录，否则任何人都能看到你的简历、消耗你的 API key。
      # HOST=0.0.0.0 时自动要求登录。你现有的账号：
      APP_USER: "${APP_USER:-}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      # 开放陌生人自助注册。默认关（只有已有账号能登录）。等每人独立数据+用量上限
      # 做完，再在 .env 里设 REGISTRATION_OPEN=1 开放。现在保持不设 = 安全。
      REGISTRATION_OPEN: "${REGISTRATION_OPEN:-}"
    volumes:
      # 把宿主机的 data/ 挂进容器：你现有的公司库/设置/结果直接复用，且持久化不丢。
      - ./data:/app/data
