# Run on your own server / machine with Docker:  docker compose up -d --build
# Note: this app is a single process with in-memory state + background scan
# threads, so run exactly one instance (no `scale`, no replicas).
#
# Put these in a .env file next to this file (never commit it):
#   APP_USER=yourname
#   APP_PASSWORD=a-long-random-password
#   # COOKIE_SECURE=0      # only while testing over plain http://<server-ip>:8080
#   # REGISTRATION_OPEN=1  # only if you want strangers to be able to sign up
services:
  app:
    build: .
    image: ai-job-scout
    container_name: ai-job-scout
    restart: unless-stopped
    ports:
      - "8080:8080"          # browse to http://<server-ip>:8080 (put HTTPS in front for real use)
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      # HOST=0.0.0.0 turns on multi-user mode, which requires a login.
      # APP_USER/APP_PASSWORD create the owner account - without them nobody can log in.
      APP_USER: "${APP_USER:-}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      # Public self-serve sign-up. Off by default (only existing accounts can log in).
      REGISTRATION_OPEN: "${REGISTRATION_OPEN:-}"
      # Session cookie is HTTPS-only by default in multi-user mode; set 0 for plain-http testing.
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      LLM_DAILY_CAP: "${LLM_DAILY_CAP:-100}"
      SCAN_DAILY_CAP: "${SCAN_DAILY_CAP:-10}"
    volumes:
      # Mount the host's data/ folder: company list, settings, results and API keys
      # persist across rebuilds and are reused as-is.
      - ./data:/app/data
